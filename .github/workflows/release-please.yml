name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-type and versioning rules are in release-please-config.json
      - uses: googleapis/release-please-action@v4
        id: release

  # Runs only when merging the release PR created a release. It lives in this workflow because a release created
  # with GITHUB_TOKEN doesn't trigger other workflows; nuget.org's trusted publishing policy names this file.
  publish:
    name: Publish to NuGet
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write   # attach the packages to the GitHub release
      id-token: write   # OIDC token for nuget.org trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0  # MinVer reads the version from the release tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release --output ./artifacts

      - name: Log in to NuGet (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: STotev

      - name: Push packages
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./artifacts/*.nupkg ./artifacts/*.snupkg
